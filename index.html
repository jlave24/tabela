<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="author" content="Jakub Kubacki">
<title>Tabela z inicjałami</title>

<style>
body{
    font-family: Arial, sans-serif;
}

table{
    border-collapse: collapse;
    margin: 20px;
}

th, td{
    width: 60px;
    height: 60px;
    border: 1px solid #666;
    text-align: center;
    vertical-align: middle;
}

th{
    background-color: #cfe8f7;
    font-weight: normal;
}

td{
    background-color: white;
}

td[colspan][rowspan]{
    background-color: #c4d79b;
    font-weight: bold;
}
</style>

</head>
<body>

<table>
<tr>
    <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th>
</tr>

<tr>
    <th>2</th>
    <td>a</td><td>b</td><td>c</td><td>d</td><td>e</td>
</tr>

<tr>
    <th>3</th>
    <td colspan="5" rowspan="2">f, g, h, i, j, k, l, m, n, o (inicjały JK)</td>
</tr>

<tr>
    <th>4</th>
</tr>

<tr>
    <th>5</th>
    <td>p</td><td>q</td><td>r</td><td>s</td><td>t</td>
</tr>

<tr>
    <th>6</th>
    <td>u</td><td>v</td><td>w</td><td>y</td><td>z</td>
</tr>
</table>
<br>
<h1>Autor: Jakub Kubacki</h1>
</body>
</html>
